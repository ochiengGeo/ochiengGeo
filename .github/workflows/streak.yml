name: Update GitHub Streak Stat

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak Stat SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user-id: "ochiengGeo"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: "github-dark-blue"
          BACKGROUND: "0D1117"
          RING: "FF6B2B"
          FIRE: "FF6B2B"
          CURR_STREAK_LABEL: "1DB899"
          SIDE_LABELS: "F0EEE8"
          BORDER: "2A2D3A"
          DATES: "8B8FA8"

      - name: Create build directory and move file
        run: |
          mkdir -p build
          mv readme-streak-stats.svg build/streak-stats.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
