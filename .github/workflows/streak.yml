name: Update GitHub Streak Stat

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Fetch Streak SVG directly
        run: |
          curl -s "https://streak-stats.demolab.com?user=ochiengGeo&theme=github-dark-blue&background=0D1117&ring=FF6B2B&fire=FF6B2B&currStreakLabel=1DB899&sideLabels=F0EEE8&border=2A2D3A&dates=8B8FA8" -o build/streak-stats.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
