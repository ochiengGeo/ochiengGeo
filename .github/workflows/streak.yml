name: Update GitHub Streak Stat

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Streak Stat SVG
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          user: ochiengGeo
          theme: github-dark-blue
          background: "0D1117"
          ring: "FF6B2B"
          fire: "FF6B2B"
          currStreakLabel: "1DB899"
          sideLabels: "F0EEE8"
          border: "2A2D3A"
          dates: "8B8FA8"
          output: "build/streak-stats.svg"

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
