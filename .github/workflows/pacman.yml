name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: ochiengGeo
          outputs: |
            dist/pacman.svg?palette=github-dark&color_snake=#FF6B2B&color_dot_empty=#2A2D3A&color_dot_filled=#1DB899,#7F77DD,#FF6B2B&game=pacman

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
