name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:

# Grant the token write permissions to deploy to the branch
permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pacman Animation SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ochiengGeo
          outputs: |
            dist/pacman.svg?palette=github-dark&color_snake=#FF6B2B&color_dot_empty=#2A2D3A&color_dot_filled=#1DB899,#7F77DD,#FF6B2B&game=pacman

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
