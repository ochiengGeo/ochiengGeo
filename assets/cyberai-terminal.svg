<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">CYBERAI system monitor</title>
  <desc id="desc">A stylized terminal showing simulated cybersecurity learning activity.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1DB899" stop-opacity=".8"/>
      <stop offset="1" stop-color="#7F77DD" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="screen"><rect x="1" y="1" width="898" height="248" rx="13"/></clipPath>
  </defs>
  <rect x="1" y="1" width="898" height="248" rx="13" fill="#0D1117" stroke="url(#edge)" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="2" y="2" width="896" height="35" fill="#161B22"/>
    <circle cx="22" cy="19" r="5" fill="#FF6B2B"/>
    <circle cx="40" cy="19" r="5" fill="#E3B341"/>
    <circle cx="58" cy="19" r="5" fill="#1DB899"/>
    <text x="450" y="23" text-anchor="middle" fill="#8B949E" font-family="monospace" font-size="12" letter-spacing="1.5">GEORGE@CYBERAI: ~ / SYSTEM MONITOR</text>
    <text x="28" y="67" fill="#1DB899" font-family="monospace" font-size="14" font-weight="bold">$ ./initialize_learning_environment.sh</text>
    <text x="28" y="91" fill="#C9D1D9" font-family="monospace" font-size="13">[ OK ]  Loading networking fundamentals...</text>
    <text x="28" y="114" fill="#C9D1D9" font-family="monospace" font-size="13">[ OK ]  Inspecting packets &amp; protocol behaviour...</text>
    <text x="28" y="137" fill="#C9D1D9" font-family="monospace" font-size="13">[ OK ]  Practising Linux and defensive security...</text>
    <text x="28" y="160" fill="#C9D1D9" font-family="monospace" font-size="13">[ .... ] Exploring secure systems &amp; intelligent technologies</text>
    <text x="28" y="194" fill="#7F77DD" font-family="monospace" font-size="12" letter-spacing="1">MODE: LEARNING  /  TRACK: CYBERSECURITY + AI  /  STATUS: IN PROGRESS</text>
    <text x="28" y="222" fill="#1DB899" font-family="monospace" font-size="13">george@cyberai:~$ <tspan fill="#FF6B2B">build. defend. grow.</tspan></text>
    <rect x="247" y="210" width="8" height="15" rx="1" fill="#1DB899">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="39" width="896" height="1" fill="#1DB899" opacity=".18"/>
    <rect x="2" y="39" width="896" height="1" fill="#1DB899" opacity=".8">
      <animate attributeName="y" values="40;242;40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.22;0" dur="7s" repeatCount="indefinite"/>
    </rect>
    <circle cx="856" cy="64" r="4" fill="#1DB899">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="869" y="68" fill="#1DB899" font-family="monospace" font-size="10" text-anchor="end">READY</text>
  </g>
</svg>